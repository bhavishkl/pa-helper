plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.bhavishkl.pahelper'
version = '1.0.0'

android {
  // Keep the library namespace distinct from the host app namespace.
  // The Kotlin source package remains com.bhavishkl.pahelper.
  namespace "com.bhavishkl.pahelper.nativebridge"

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 36
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "com.google.mlkit:text-recognition:16.0.1"
}
