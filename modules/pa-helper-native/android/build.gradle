plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.bhavishkl.pahelper'
version = '1.0.0'

android {
  namespace "com.bhavishkl.pahelper"

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 36
  }
}

dependencies {
  implementation "com.google.mlkit:text-recognition:16.0.1"
}
